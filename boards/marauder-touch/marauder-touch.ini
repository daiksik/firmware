; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Marauder-V4-V6]
board = esp32dev
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/marauder-touch>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}

	-Iboards/marauder-touch

	-D SDCARD_CS=12
	
	; --- НАСТРОЙКИ ЭКРАНА 1.8 С КРАСНЫМ МАРКЕРОМ ---
	-D USER_SETUP_LOADED=1
	-D ST7735_DRIVER=1
	-D ST7735_REDTAB=1
	-D TFT_RGB_ORDER=TFT_BGR
	-D TFT_WIDTH=128
	-D TFT_HEIGHT=160

	; --- ТВОИ ПИНЫ ПОДКЛЮЧЕНИЯ ЭКРАНА К ESP32 ---
	-D TFT_MOSI=13            ; Экран SDA  -> ESP Пин 13
	-D TFT_SCLK=14            ; Экран SCL  -> ESP Пин 14
	-D TFT_CS=17              ; Экран CS   -> ESP Пин 17
	-D TFT_DC=16              ; Экран DC   -> ESP Пин 16
	-D TFT_RST=5              ; Экран RES  -> ESP Пин 5
	-D TFT_BL=32              ; Экран BLK  -> ESP Пин 32


	-DDEVICE_NAME='"Marauder v4-v6"'

lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}

[env:Marauder-v61]
extends=env:Marauder-V4-V6
build_flags =
	${env:Marauder-V4-V6.build_flags}
	-D SDCARD_CS=14
build_unflags =
	-D SDCARD_CS=12

[env:LAUNCHER_Marauder-V4-V6]
extends=env:Marauder-V4-V6
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:Marauder-V4-V6.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}

[env:LAUNCHER_Marauder-v61]
extends=env:Marauder-v61
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:Marauder-v61.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}



[env:Awok-Touch]
extends = env:Marauder-v61
board_build.partitions = custom_16Mb.csv
board_upload.maximum_size = 16777216
board_upload.flash_size=16MB


[env:WaveSentry-R1]
extends=env:Marauder-V4-V6
build_flags =
	${env:Marauder-V4-V6.build_flags}
	-D WAVESENTRY=1
	-D ENCODER_INA=2
	-D ENCODER_INB=14
	-D ENCODER_KEY=0
	-D HAS_ENCODER=1
lib_deps =
	${env.lib_deps}

[env:LAUNCHER_WaveSentry-R1]
extends = env:WaveSentry-R1
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:WaveSentry-R1.build_flags}
	${env_light.build_flags}

lib_deps =
	${env_light.lib_deps}

